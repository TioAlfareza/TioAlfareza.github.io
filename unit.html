<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit — H5P Listening Materials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/h5p-player/styles/h5p.css">
<style>
  :root{
    --ink:#16202a; --ink-soft:#4b5a68; --line:#e2ded7; --paper:#fbf9f5;
    --accent:#0d6b6b; --accent-soft:#e6f1f0; --radius:14px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font:16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }
  .shell{ max-width:1080px; margin:0 auto; padding:0 28px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:20px;
           padding:20px 0; border-bottom:1px solid var(--line); }
  .back{ display:inline-flex; align-items:center; gap:8px; text-decoration:none;
         font-size:14px; font-weight:500; color:var(--ink-soft); }
  .back:hover{ color:var(--accent); }
  .back svg{ width:15px; height:15px; }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px; }
  .mark{ width:28px; height:28px; border-radius:7px; display:grid; place-items:center;
         background:var(--accent); color:#fff; font-size:12px; font-weight:600; }

  .unit-head{ padding:38px 0 26px; }
  .crumb{ font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
          color:var(--accent); margin-bottom:12px; }
  h1{ font-family:Fraunces, Georgia, serif; font-weight:600; letter-spacing:-.02em;
      font-size:clamp(27px, 4vw, 38px); line-height:1.15; margin:0 0 10px; }
  .sub{ margin:0; color:var(--ink-soft); font-size:16px; }

  .stage{ background:#fff; border:1px solid var(--line); border-radius:var(--radius);
          overflow:hidden; min-height:480px; box-shadow:0 1px 2px rgba(22,32,42,.05), 0 10px 30px -18px rgba(22,32,42,.25); }
  .stage .h5p-content{ min-height:480px; }

  .footnav{ display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between;
            align-items:center; padding:22px 0 60px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ font-size:13px; padding:8px 14px; border:1px solid var(--line); border-radius:8px;
         background:#fff; text-decoration:none; color:var(--ink); }
  .chip:hover{ border-color:var(--accent); color:var(--accent); }
  .chip[aria-current="page"]{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .hint{ font-size:13px; color:var(--ink-soft); }

  .fallback{ padding:40px 28px; font-size:15px; line-height:1.65; }
  .fallback code{ background:#f1ede6; padding:2px 6px; border-radius:5px; font-size:13px; }

  @media (max-width:640px){
    .stage{ min-height:380px; border-radius:10px; }
    .unit-head{ padding:26px 0 18px; }
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <a class="back" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      All units
    </a>
    <div class="brand"><span class="mark">H5P</span> Listening Materials</div>
  </div>

  <div class="unit-head">
    <div class="crumb" id="crumb">&nbsp;</div>
    <h1 id="title">Loading…</h1>
    <p class="sub" id="sub"></p>
  </div>

  <div class="stage" id="stage"></div>

  <div class="footnav">
    <div class="chips" id="chips"></div>
    <span class="hint">Use the arrows inside the activity to move between pages.</span>
  </div>
</div>

<script src="assets/h5p-player/main.bundle.js" charset="UTF-8"></script>
<script>
// Read the constructor once: H5P's own init clears this global afterwards.
const Player = H5PStandalone && H5PStandalone.H5P;
const BASE = location.pathname.replace(/\/[^/]*$/, '');

const UNITS = [
  { slug:'unit-1-narrative',     topic:'Narrative Text',       title:'Technology Story',                        blurb:'Following a sequence of events, characters, and setting.' },
  { slug:'unit-2-argumentative', topic:'Argumentative Text',   title:'Is Social Media More Helpful or Harmful?', blurb:'Identifying the writer\u2019s position and supporting reasons.' },
  { slug:'unit-3-hortatory',     topic:'Hortatory Exposition', title:'We should reduce plastic waste',           blurb:'Identifying recommendations and supporting arguments.' },
  { slug:'unit-4-discussion',    topic:'Discussion Text',      title:'Carbon Footprint',                        blurb:'Distinguishing arguments for and against an issue.' }
];

const slug = new URLSearchParams(location.search).get('u');
const unit = UNITS.find(u => u.slug === slug) || UNITS[0];
const stage = document.getElementById('stage');

document.title = unit.topic + ' — H5P Listening Materials';
document.getElementById('crumb').textContent = 'Unit ' + (UNITS.indexOf(unit) + 1) + ' of ' + UNITS.length;
document.getElementById('title').textContent = unit.topic;
document.getElementById('sub').textContent = unit.title + ' · ' + unit.blurb;

document.getElementById('chips').innerHTML = UNITS.map(u =>
  '<a class="chip" href="unit.html?u=' + u.slug + '"' + (u === unit ? ' aria-current="page"' : '') + '>' +
  u.topic + '</a>'
).join('');

if (!Player) {
  stage.innerHTML = '<div class="fallback">The H5P player could not load. Check that ' +
    '<code>assets/h5p-player/main.bundle.js</code> exists and that the page is served over http, ' +
    'not opened as a <code>file://</code> path.</div>';
} else {
  new Player(stage, {
    // Absolute paths: the player builds asset URLs as host + path with no separator.
    h5pJsonPath: BASE + '/content/' + unit.slug,
    frameJs: BASE + '/assets/h5p-player/frame.bundle.js',
    frameCss: BASE + '/assets/h5p-player/styles/h5p.css',
    frame: true,
    reportingIsEnabled: true,
    copyright: true,
    icon: false
  });
}
</script>
</body>
</html>
